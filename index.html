<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10131a" />
    <meta name="description" content="A cinematic travel atlas powered by the CSS View Transitions API." />
    <title>Elsewhere — A View Transition Atlas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="noise" aria-hidden="true"></div>
    <main class="app" id="app">
      <section class="atlas view is-active" id="atlas" aria-labelledby="atlas-title">
        <header class="topbar"><a class="brand" href="#atlas" aria-label="Elsewhere home"><span class="brand__mark">E</span><span>Elsewhere</span></a><p class="topbar__note">A View Transition Atlas</p><button class="motion-toggle" id="motionToggle" type="button" aria-pressed="false">Motion: on</button></header>
        <div class="atlas__intro"><p class="eyebrow">Choose a perspective</p><h1 id="atlas-title">Four places.<br />One moving canvas.</h1><p class="atlas__lede">Open a destination and watch its image, title and accent travel into a new composition.</p></div>
        <div class="destination-grid" id="destinationGrid" aria-label="Destinations"></div>
        <footer class="atlas__footer"><span>Use arrow keys to explore</span><span>Built for #cpc-view-transitions</span></footer>
      </section>
      <section class="story view" id="story" aria-hidden="true"><div class="story__backdrop" id="storyBackdrop" aria-hidden="true"></div><header class="story__topbar"><button class="icon-button" id="backButton" type="button" aria-label="Back to atlas">←</button><span class="story__counter" id="storyCounter">01 / 04</span><button class="icon-button" id="nextButton" type="button" aria-label="Next destination">→</button></header><article class="story__layout"><figure class="story__visual" id="storyVisual"><img class="story__image" id="storyImage" src="" alt="" /><figcaption class="story__coordinates" id="storyCoordinates"></figcaption></figure><div class="story__content"><p class="eyebrow" id="storyKicker"></p><h2 class="story__title" id="storyTitle" tabindex="-1"></h2><p class="story__summary" id="storySummary"></p><dl class="story__facts" id="storyFacts"></dl><blockquote class="story__quote" id="storyQuote"></blockquote><div class="story__nav"><button class="text-button" id="previousButton" type="button">← Previous</button><button class="text-button" id="nextTextButton" type="button">Next place →</button></div></div></article></section>
    </main>
    <div class="support-note" id="supportNote" role="status" aria-live="polite"></div><script src="./script.js"></script>
  </body>
</html>
